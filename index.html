<!DOCTYPE html>
<html>
<head>
  <title>E‑Z Box Instant Quote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { 
      font-family: Arial, sans-serif; 
      background:#f7f7f7; 
      padding:40px; 
      font-size:20px;
    }

    .container { 
      max-width:650px; 
      margin:auto; 
      background:white; 
      padding:30px; 
      border-radius:12px; 
      box-shadow:0 0 15px rgba(0,0,0,0.15); 
    }

    button { 
      background:#0078D4; 
      color:white; 
      border:none; 
      padding:15px; 
      width:100%; 
      border-radius:8px; 
      font-size:20px; 
      cursor:pointer;
    }

    select, input { 
      width:100%; 
      padding:12px; 
      margin-bottom:15px; 
      font-size:18px;
    }

    #quoteResult {
      font-size:20px;
      line-height:1.6;
    }
  </style>
</head>
<body>

<!-- LOGO -->
<div style="text-align:center; margin-bottom:20px;">
<img src="logo.jpg" alt="RVA EZ BOX Logo" style="max-width:300px; width:100%; height:auto;">
</div>

<div class="container">
  <h2>E‑Z Box Instant Quote</h2>

  <label>Choose Your Box Size:</label>
  <select id="boxSize">
    <option value="159">16' x 8' x 8' — $159/mo</option>
    <option value="149">12' x 8' x 8' — $149/mo</option>
    <option value="129">8' x 8' x 8' — $129/mo</option>
  </select>

  <label>Distance From Our Location (miles):</label>
  <input id="distance" type="number" min="0" placeholder="Enter miles">

  <button onclick="calculateQuote()">Get Quote</button>

  <div id="quoteResult" style="margin-top:20px;"></div>
</div>

<script>
function calculateQuote() {
  const taxRate = 0.06;
  const monthly = Number(document.getElementById("boxSize").value);
  const miles = Number(document.getElementById("distance").value);

  let transportationFee = 85;
  if (miles > 30) {
    transportationFee = 85 + ((miles - 30) * 2.25);
  }

  const monthlyWithTax = monthly + (monthly * taxRate);

  // Initial Fees = Total Monthly Rent + (Transportation Fee × 2)
  const initialFees = monthlyWithTax + (transportationFee * 2);

  const result = `
    <strong>Monthly Rental:</strong> $${monthly.toFixed(2)}<br>
    <strong>Tax:</strong> $${(monthly * taxRate).toFixed(2)}<br>
    <strong>Total Monthly Rent:</strong> $${monthlyWithTax.toFixed(2)}<br><br>
    <strong>Transportation Fee:</strong> $${transportationFee.toFixed(2)}<br><br>
    <strong><u>Initial Fees:</u></strong> $${initialFees.toFixed(2)}<br>
    <em>(Monthly rent + Delivery + Pickup)</em>
  `;

  document.getElementById("quoteResult").innerHTML = result;
}
</script>

</body>
</html>
